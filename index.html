<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🐣 电子宠物</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: linear-gradient(180deg, #fce4ec 0%, #e8f5e9 100%);
    min-height: 100vh;
    font-family: 'Segoe UI', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
  }
  .container {
    width: 100%;
    max-width: 420px;
    padding: 20px 16px;
    text-align: center;
  }
  /* 地面 */
  .ground {
    width: 100%;
    height: 40px;
    background: linear-gradient(180deg, #8d6e63 0%, #6d4c41 100%);
    border-radius: 20px 20px 0 0;
    margin-top: -10px;
    position: relative;
  }
  .ground::after {
    content: '';
    position: absolute;
    top: -8px;
    left: 10%;
    right: 10%;
    height: 16px;
    background: #a5d6a7;
    border-radius: 10px 10px 0 0;
  }
  /* 宠物区域 */
  .pet-area {
    background: #fff;
    border-radius: 30px;
    padding: 24px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.1);
    margin-bottom: 20px;
    position: relative;
    min-height: 320px;
  }
  .pet {
    font-size: 100px;
    transition: transform 0.3s ease;
    display: inline-block;
    cursor: pointer;
    animation: float 3s ease-in-out infinite;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0) rotate(-3deg); }
    50% { transform: translateY(-12px) rotate(3deg); }
  }
  .pet.bounce { animation: bounce 0.5s ease; }
  @keyframes bounce {
    0% { transform: scale(1) translateY(0); }
    30% { transform: scale(1.1) translateY(-20px); }
    60% { transform: scale(0.95) translateY(5px); }
    100% { transform: scale(1) translateY(0); }
  }
  .pet.jump { animation: jump 0.8s ease; }
  @keyframes jump {
    0% { transform: translateY(0) rotate(0deg); }
    25% { transform: translateY(-50px) rotate(-10deg); }
    50% { transform: translateY(-30px) rotate(10deg); }
    75% { transform: translateY(-50px) rotate(-5deg); }
    100% { transform: translateY(0) rotate(0deg); }
  }
  .pet-name {
    font-size: 20px;
    font-weight: bold;
    color: #5d4037;
    margin: 8px 0;
  }
  .pet-status {
    font-size: 14px;
    color: #9e9e9e;
    margin-bottom: 12px;
  }
  /* 气泡对话 */
  .bubble {
    background: #fff;
    border: 2px solid #b2dfdb;
    border-radius: 20px 20px 20px 5px;
    padding: 16px 20px;
    margin: 16px 0;
    font-size: 16px;
    line-height: 1.6;
    color: #333;
    min-height: 48px;
    position: relative;
    display: flex;
    align-items: center;
  }
  .bubble::before {
    content: '💬';
    font-size: 20px;
    margin-right: 8px;
  }
  /* 心情指示 */
  .mood-bar {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin: 12px 0;
  }
  .mood-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    font-size: 12px;
    color: #9e9e9e;
  }
  .mood-item .icon { font-size: 24px; }
  .mood-item .bar {
    width: 4px;
    height: 24px;
    background: #e0e0e0;
    border-radius: 4px;
    margin: 4px 0;
    overflow: hidden;
    position: relative;
  }
  .mood-item .bar-fill {
    position: absolute;
    bottom: 0;
    width: 100%;
    border-radius: 4px;
    transition: height 0.5s ease;
  }
  /* 按钮 */
  .btn-group {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    margin: 16px 0;
  }
  .btn {
    padding: 12px 24px;
    border: none;
    border-radius: 25px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.2s ease;
    flex: 1;
    min-width: 100px;
  }
  .btn:active { transform: scale(0.95); }
  .btn-primary { background: #4caf50; color: #fff; }
  .btn-primary:hover { background: #388e3c; }
  .btn-secondary { background: #ff9800; color: #fff; }
  .btn-secondary:hover { background: #ef6c00; }
  .btn-danger { background: #ef5350; color: #fff; }
  .btn-danger:hover { background: #c62828; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  /* 相机预览 */
  #camera-preview {
    display: none;
    width: 100%;
    max-height: 300px;
    border-radius: 16px;
    margin: 12px 0;
    object-fit: cover;
  }
  .camera-active #camera-preview { display: block; }
  /* 拍照结果 */
  .photo-result {
    display: none;
    width: 100%;
    border-radius: 16px;
    margin: 12px 0;
  }
  /* 等待动画 */
  .thinking {
    display: none;
    text-align: center;
    padding: 16px;
  }
  .thinking span {
    display: inline-block;
    width: 10px; height: 10px;
    border-radius: 50%;
    background: #4caf50;
    margin: 0 4px;
    animation: dot 1.4s ease-in-out infinite;
  }
  .thinking span:nth-child(2) { animation-delay: 0.2s; }
  .thinking span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes dot {
    0%, 80%, 100% { transform: scale(0.5); opacity: 0.3; }
    40% { transform: scale(1); opacity: 1; }
  }
  /* 环境光 */
  .env-indicator {
    display: flex;
    justify-content: center;
    gap: 16px;
    font-size: 13px;
    color: #757575;
    margin: 8px 0;
  }
  .env-indicator span { display: flex; align-items: center; gap: 4px; }
  /* 底部 */
  .footer {
    font-size: 12px;
    color: #bdbdbd;
    margin-top: 20px;
    padding-bottom: 30px;
  }
</style>
</head>
<body>

<div class="container">
  <!-- 宠物区域 -->
  <div class="pet-area">
    <div class="pet" id="pet">🐣</div>
    <div class="pet-name">🥚 小蛋蛋</div>
    <div class="pet-status" id="status">🐣 刚刚出生，有点害羞</div>
    
    <!-- 心情条 -->
    <div class="mood-bar">
      <div class="mood-item">
        <span class="icon">😊</span>
        <div class="bar"><div class="bar-fill" id="happiness-bar" style="height:60%;background:#4caf50"></div></div>
        <span>快乐</span>
      </div>
      <div class="mood-item">
        <span class="icon">🍖</span>
        <div class="bar"><div class="bar-fill" id="hunger-bar" style="height:30%;background:#ff9800"></div></div>
        <span>饱腹</span>
      </div>
      <div class="mood-item">
        <span class="icon">⚡</span>
        <div class="bar"><div class="bar-fill" id="energy-bar" style="height:80%;background:#2196f3"></div></div>
        <span>精力</span>
      </div>
    </div>
    
    <!-- 对话气泡 -->
    <div class="bubble" id="bubble">你好呀！我是小蛋蛋 🐣<br>点点我或者喂我吃东西吧～</div>
    
    <!-- 环境指示 -->
    <div class="env-indicator">
      <span>🌡️ <span id="temp">--</span>°C</span>
      <span>🔊 <span id="noise">--</span></span>
      <span>🕐 <span id="time">--</span></span>
    </div>
  </div>

  <!-- 相机预览 -->
  <video id="camera-preview" autoplay playsinline></video>
  <img id="photo-result" class="photo-result">
  
  <!-- 等待动画 -->
  <div class="thinking" id="thinking">
    <span></span><span></span><span></span>
    <p style="margin-top:8px;color:#9e9e9e;font-size:14px">小蛋蛋在想...</p>
  </div>

  <!-- 按钮 -->
  <div class="btn-group">
    <button class="btn btn-primary" id="btn-feed" onclick="feed()">🍼 喂食</button>
    <button class="btn btn-secondary" id="btn-camera" onclick="toggleCamera()">📸 拍照</button>
    <button class="btn btn-primary" id="btn-play" onclick="play()">🎾 玩耍</button>
  </div>
  <div class="btn-group">
    <button class="btn btn-secondary" id="btn-snap" onclick="snapPhoto()" style="display:none">📷 咔嚓</button>
    <button class="btn btn-danger" onclick="sleep()">😴 睡觉</button>
    <button class="btn btn-primary" onclick="surprise()">🎁 惊喜</button>
  </div>

  <div class="footer">
    小蛋蛋 v1.0 · 用爱陪伴 🐣
  </div>
</div>

<script>
// ===== 宠物状态 =====
const PET = {
  emojis: ['🐣', '🐥', '🐤', '🐔', '🦆'],
  currentEmoji: 0,
  happiness: 60,
  hunger: 30,
  energy: 80,
  isSleeping: false,
  cameraActive: false,
  stream: null,
  lastPhoto: null,
  growth: 0,
  growthMax: 100,
};

// ===== 更新显示 =====
function updateDisplay() {
  const pet = document.getElementById('pet');
  const status = document.getElementById('status');
  const bubble = document.getElementById('bubble');
  
  // 更新心情条
  document.getElementById('happiness-bar').style.height = PET.happiness + '%';
  document.getElementById('hunger-bar').style.height = PET.hunger + '%';
  document.getElementById('energy-bar').style.height = PET.energy + '%';
  
  // 更新表情
  const emojiIdx = Math.min(PET.currentEmoji, PET.emojis.length - 1);
  pet.textContent = PET.emojis[emojiIdx];
  
  // 更新状态文字
  if (PET.isSleeping) {
    status.textContent = '😴 正在睡觉... Zzz...';
  } else if (PET.energy < 20) {
    status.textContent = '😩 好累啊... 想睡觉...';
  } else if (PET.hunger < 20) {
    status.textContent = '🤤 肚子好饿... 喂我吃东西吧...';
  } else if (PET.happiness > 80) {
    status.textContent = '😆 超级开心！蹦蹦跳跳！';
  } else if (PET.happiness > 50) {
    status.textContent = '😊 心情不错～';
  } else {
    status.textContent = '😐 有点无聊... 陪我玩吧...';
  }
  
  // 更新环境
  updateEnv();
}

function updateEnv() {
  const now = new Date();
  document.getElementById('time').textContent = 
    now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0');
  
  // 模拟环境变化
  if (PET.temp === undefined) {
    PET.temp = 24 + Math.floor(Math.random() * 4);
    document.getElementById('temp').textContent = PET.temp;
  }
  PET.noise = PET.noise || ['🤫安静', '🔉轻微', '🔊热闹', '📢嘈杂'][Math.floor(Math.random() * 4)];
  document.getElementById('noise').textContent = PET.noise;
}

function setBubble(text, emoji) {
  const bubble = document.getElementById('bubble');
  bubble.innerHTML = (emoji || '💬') + ' ' + text;
}

// ===== 互动功能 =====
function feed() {
  if (PET.isSleeping) { setBubble('😴 Zzz... 别吵我睡觉...'); return; }
  PET.hunger = Math.min(100, PET.hunger + 25);
  PET.happiness = Math.min(100, PET.happiness + 5);
  PET.energy = Math.min(100, PET.energy + 5);
  
  const msgs = ['好好吃！😋', '再来一口！🍼', '好饱好饱～', 'Yummy! 🥰', '最喜欢吃东西了！'];
  setBubble(msgs[Math.floor(Math.random() * msgs.length)], '🍼');
  bouncePet();
  updateDisplay();
  
  // 成长
  PET.growth = Math.min(PET.growthMax, PET.growth + 3);
  checkGrowth();
}

function play() {
  if (PET.isSleeping) { setBubble('😴 Zzz... 明天再玩吧...'); return; }
  if (PET.energy < 15) { setBubble('😩 好累... 玩不动了...'); return; }
  
  PET.energy = Math.max(0, PET.energy - 15);
  PET.happiness = Math.min(100, PET.happiness + 20);
  PET.hunger = Math.max(0, PET.hunger - 5);
  
  const msgs = ['哈哈好好玩！🎾', '再来一次！✨', '我最喜欢你了！🥰', '转圈圈～好开心！'];
  setBubble(msgs[Math.floor(Math.random() * msgs.length)], '🎾');
  jumpPet();
  updateDisplay();
  
  PET.growth = Math.min(PET.growthMax, PET.growth + 5);
  checkGrowth();
}

function sleep() {
  if (PET.isSleeping) {
    // 叫醒
    PET.isSleeping = false;
    PET.energy = Math.min(100, PET.energy + 40);
    setBubble('早上好！睡得好舒服 ☀️', '🌅');
  } else {
    if (PET.energy >= 80) {
      setBubble('我还不困呢！再玩一会儿吧～', '💪');
      return;
    }
    PET.isSleeping = true;
    PET.happiness = Math.min(100, PET.happiness + 5);
    setBubble('Zzz... 晚安... 😴', '🌙');
  }
  updateDisplay();
}

function surprise() {
  if (PET.isSleeping) { setBubble('😴 Zzz...'); return; }
  PET.happiness = Math.min(100, PET.happiness + 15);
  
  const surprises = [
    '哇！是什么？！🤩', '吓我一跳！😂', '好惊喜！🎉', 
    '哇塞！！🥳', '天哪好开心！💖', '咦？有礼物？！🎁'
  ];
  setBubble(surprises[Math.floor(Math.random() * surprises.length)], '🎁');
  jumpPet();
  updateDisplay();
  
  PET.growth = Math.min(PET.growthMax, PET.growth + 2);
  checkGrowth();
}

function checkGrowth() {
  if (PET.growth >= 100) {
    PET.currentEmoji = PET.currentEmoji + 1;
    if (PET.currentEmoji < PET.emojis.length) {
      setBubble(`🥳 我进化了！变成 ${PET.emojis[PET.currentEmoji]} 啦！`, '🌟');
      PET.growth = 0;
    }
  }
}

// ===== 宠物动画 =====
function bouncePet() {
  const pet = document.getElementById('pet');
  pet.classList.remove('bounce');
  void pet.offsetWidth;
  pet.classList.add('bounce');
}

function jumpPet() {
  const pet = document.getElementById('pet');
  pet.classList.remove('jump');
  void pet.offsetWidth;
  pet.classList.add('jump');
}

// 点击宠物
document.getElementById('pet').addEventListener('click', function() {
  if (PET.isSleeping) {
    setBubble('😴 Zzz...');
    return;
  }
  PET.happiness = Math.min(100, PET.happiness + 3);
  const reacts = ['嘿嘿～', '痒痒的！😆', '摸摸头～', '再摸一下！💕', '好舒服～'];
  setBubble(reacts[Math.floor(Math.random() * reacts.length)], '👆');
  bouncePet();
  updateDisplay();
});

// ===== 相机功能 =====
async function toggleCamera() {
  const btn = document.getElementById('btn-camera');
  const preview = document.getElementById('camera-preview');
  const snapBtn = document.getElementById('btn-snap');
  
  if (PET.cameraActive) {
    // 关闭相机
    if (PET.stream) {
      PET.stream.getTracks().forEach(t => t.stop());
      PET.stream = null;
    }
    preview.style.display = 'none';
    snapBtn.style.display = 'none';
    btn.textContent = '📸 拍照';
    PET.cameraActive = false;
    setBubble('拜拜～ 📸', '👋');
    return;
  }
  
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ 
      video: { facingMode: 'environment', width: { ideal: 1280 } },
      audio: false 
    });
    PET.stream = stream;
    preview.srcObject = stream;
    preview.style.display = 'block';
    snapBtn.style.display = 'inline-block';
    btn.textContent = '❌ 关闭相机';
    PET.cameraActive = true;
    setBubble('让我看看你周围有什么～ 👀', '📸');
  } catch (err) {
    setBubble('😅 打不开相机... 请允许相机权限', '❌');
    console.error('Camera error:', err);
  }
}

function snapPhoto() {
  if (!PET.cameraActive || !PET.stream) return;
  
  const video = document.getElementById('camera-preview');
  const canvas = document.createElement('canvas');
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(video, 0, 0);
  
  const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
  const resultImg = document.getElementById('photo-result');
  resultImg.src = dataUrl;
  resultImg.style.display = 'block';
  PET.lastPhoto = dataUrl;
  
  // 显示"正在思考"
  document.getElementById('thinking').style.display = 'block';
  setBubble('让我看看拍了什么... 🤔', '🤔');
  
  // 模拟分析（实际使用时可以对接后端）
  setTimeout(() => {
    document.getElementById('thinking').style.display = 'none';
    const reactions = [
      '哇！你那边看起来不错呀！🌈', 
      '我看到了... 好多有趣的东西！👀',
      '嘿嘿，你周围的环境好棒！🌟',
      '要是我也能在那里就好了～🥺',
      '好漂亮！给我多拍几张！📸'
    ];
    setBubble(reactions[Math.floor(Math.random() * reactions.length)], '🤩');
    PET.happiness = Math.min(100, PET.happiness + 10);
    updateDisplay();
  }, 1500);
}

// ===== 自动消耗 =====
setInterval(() => {
  if (PET.isSleeping) {
    PET.energy = Math.min(100, PET.energy + 2);
    PET.hunger = Math.max(0, PET.hunger - 0.5);
  } else {
    PET.energy = Math.max(0, PET.energy - 0.5);
    PET.hunger = Math.max(0, PET.hunger - 0.3);
    PET.happiness = Math.max(0, PET.happiness - 0.1);
  }
  updateDisplay();
}, 5000);

// ===== 初始化 =====
updateDisplay();
setBubble('你好呀！我是小蛋蛋 🐣\n点点我或者喂我吃东西吧～', '👋');

// 偶尔主动说话
const randomTalks = [
  '陪我玩嘛～', '今天天气怎么样？☀️', '好无聊啊...', 
  '我好饿... 🍼', '嘿嘿嘿 😊', '你那边是什么声音？👂'
];
setInterval(() => {
  if (PET.isSleeping) return;
  if (Math.random() < 0.3) {
    setBubble(randomTalks[Math.floor(Math.random() * randomTalks.length)], '💬');
  }
}, 30000);

</script>
</body>
</html>
